context:
  version: "0.23.0"

package:
  name: pylangacq
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pylangacq/pylangacq-${{ version }}.tar.gz
  sha256: eb5c02f5b8b4c267557a19bdbcadbe395a1ca8d4092c08a8a0398d1eef33ec87

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - rustling >=0.7.0

tests:
  - python:
      imports:
        - pylangacq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pylangacq.org
  summary: Language Acquisition Research in Python
  license: MIT
  license_file: LICENSE.txt
  documentation: https://pylangacq.org
  repository: https://github.com/jacksonllee/pylangacq

extra:
  recipe-maintainers:
    - jacksonllee
